<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KONTROL APAR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* CSS tetap menggunakan desain sebelumnya */
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f6f8; margin: 0; padding: 0; }
        .container { max-width: 480px; margin: 0 auto; background: white; min-height: 100vh; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        .header { background: #2c3e50; color: white; padding: 25px; text-align: center; border-radius: 0 0 25px 25px; }
        .content { padding: 25px; flex: 1; }
        .status-card { text-align: center; padding: 25px; border-radius: 15px; margin-bottom: 25px; color: white; }
        .bg-ok { background: linear-gradient(135deg, #27ae60, #2ecc71); }
        .bg-warn { background: linear-gradient(135deg, #c0392b, #e74c3c); }
        .info-group { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
        .info-label { font-size: 12px; color: #95a5a6; font-weight: bold; }
        .info-val { font-size: 15px; font-weight: 600; color: #2c3e50; }
        .btn-edit-form { display: block; background: #f39c12; color: white; text-align: center; padding: 15px; border-radius: 12px; text-decoration: none; font-weight: bold; margin: 20px 0; }
        .badge { font-size: 11px; padding: 4px 12px; border-radius: 20px; color: white; }
        .b-ok { background: #2e7d32; }
        .b-bad { background: #c62828; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>KONTROL APAR</h1>
        <p>Detail Inspeksi Berdasarkan Baris</p>
    </div>

    <div id="main-content" class="content">
        <div id="status-card"></div>

        <a id="display-edit-link" href="#" target="_blank" class="btn-edit-form">
            <i class="fas fa-edit"></i> UPDATE DATA INI
        </a>

        <div class="info-group">
            <span class="info-label">Nomor APAR</span>
            <span class="info-val" id="display-no"></span>
        </div>
        <div class="info-group">
            <span class="info-label">Lokasi</span>
            <span class="info-val" id="display-loc"></span>
        </div>
        <div class="info-group">
            <span class="info-label">Timestamp</span>
            <span class="info-val" id="display-time"></span>
        </div>

        <h3 style="font-size:14px; margin-top:20px;">HASIL CEK:</h3>
        <div id="checklist-container"></div>
    </div>
</div>

<script>
    const GOOGLE_SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR1ed1CBEE_XALINYXAeepoKXlOKPyYLRiY35LL1OUd2wqgSbBgD2stFTG1YCjqfdCsNhc3A_PhrGE-/pub?gid=844795211&single=true&output=csv';
    const PROXY_URL = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(GOOGLE_SHEET_URL);
    
    const urlParams = new URLSearchParams(window.location.search);
    const targetRow = urlParams.get('id');

    window.onload = function() {
        Papa.parse(PROXY_URL, {
            download: true, header: false, skipEmptyLines: true,
            complete: function(results) {
                const data = results.data;
                const rowIndex = parseInt(targetRow) - 1; 

                if (data[rowIndex]) {
                    const row = data[rowIndex];
                    // Mapping Manual berdasarkan Urutan Kolom di CSV 
                    const mapped = {
                        no: row[5], loc: row[4], time: row[0],
                        tekanan: row[8], pin: row[9], selang: row[10], fisik: row[11],
                        catatan: row[14], edit: row[16]
                    };
                    renderData(mapped);
                }
            }
        });
    };

    function renderData(data) {
        document.getElementById('display-no').innerText = data.no;
        document.getElementById('display-loc').innerText = data.loc;
        document.getElementById('display-time').innerText = data.time;
        document.getElementById('display-edit-link').href = data.edit;

        const checks = [
            { l: "Tekanan", v: data.tekanan },
            { l: "Pin/Segel", v: data.pin },
            { l: "Selang", v: data.selang },
            { l: "Fisik", v: data.fisik }
        ];

        let hasProblem = false;
        let html = "";
        checks.forEach(c => {
            const isBad = (c.v === "TIDAK");
            if(isBad) hasProblem = true;
            html += `<div class="info-group"><span>${c.l}</span><span class="badge ${isBad ? 'b-bad' : 'b-ok'}">${c.v}</span></div>`;
        });
        document.getElementById('checklist-container').innerHTML = html;

        const card = document.getElementById('status-card');
        card.className = "status-card " + (hasProblem ? "bg-warn" : "bg-ok");
        card.innerHTML = `<h2>${hasProblem ? "PERLU PERHATIAN" : "KONDISI AMAN"}</h2>`;
    }
</script>
</body>
</html>
