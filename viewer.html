<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KONTROL APAR</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f0f2f5; margin: 0; padding: 0; color: #333;
        }
        .container { max-width: 480px; margin: 0 auto; min-height: 100vh; background: white; box-shadow: 0 0 15px rgba(0,0,0,0.05); }
        
        /* Header */
        .header { background: #2c3e50; color: white; padding: 20px; text-align: center; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; }
        .header h1 { margin: 0; font-size: 22px; }
        .header p { margin: 5px 0 0; opacity: 0.8; font-size: 13px; }

        /* Content Area */
        .content { padding: 20px; }
        
        /* Status Card */
        .status-card { 
            text-align: center; padding: 20px; border-radius: 12px; margin-bottom: 20px; color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .bg-ok { background: linear-gradient(135deg, #27ae60, #2ecc71); }
        .bg-warn { background: linear-gradient(135deg, #e67e22, #f1c40f); }
        .bg-error { background: linear-gradient(135deg, #c0392b, #e74c3c); }
        
        .status-icon { font-size: 40px; margin-bottom: 10px; }
        .status-text { font-size: 20px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Info Grid */
        .info-group { margin-bottom: 20px; }
        .info-label { font-size: 12px; color: #7f8c8d; text-transform: uppercase; font-weight: 600; margin-bottom: 5px; }
        .info-value { font-size: 16px; font-weight: 500; color: #2c3e50; border-bottom: 1px solid #eee; padding-bottom: 8px; }

        /* Checklist Table */
        .check-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .check-table td { padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
        .check-table tr:last-child td { border-bottom: none; }
        .check-item { font-weight: 500; color: #555; }
        .check-val { text-align: right; font-weight: 600; }
        .val-ok { color: #27ae60; }
        .val-bad { color: #e74c3c; }

        /* Loading & Error */
        #loader { text-align: center; padding: 50px; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .footer { text-align: center; font-size: 11px; color: #aaa; padding: 20px; margin-top: 20px; border-top: 1px solid #eee; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>KONTROL APAR</h1>
        <p>Sistem Pemantauan Online</p>
    </div>

    <div id="loader">
        <div class="spinner"></div>
        <p>Mengambil data terbaru...</p>
    </div>

    <div id="app-content" class="content" style="display: none;">
        <div id="status-container"></div>

        <div class="info-group">
            <div class="info-label">Nomor APAR</div>
            <div class="info-value" id="disp-no"></div>
        </div>
        <div class="info-group">
            <div class="info-label">Lokasi Penempatan</div>
            <div class="info-value" id="disp-loc"></div>
        </div>
        
        <div style="display: flex; gap: 15px;">
             <div class="info-group" style="flex:1;">
                <div class="info-label">Jenis</div>
                <div class="info-value" id="disp-type"></div>
            </div>
            <div class="info-group" style="flex:1;">
                <div class="info-label">Berat</div>
                <div class="info-value" id="disp-weight"></div>
            </div>
        </div>

        <h3 style="margin-top:25px; font-size:16px; border-bottom:2px solid #eee; padding-bottom:10px;">
            <i class="fas fa-clipboard-check" style="color:#3498db"></i> Detail Inspeksi
        </h3>
        
        <table class="check-table">
            <tbody id="checklist-body"></tbody>
        </table>

        <div class="info-group" style="margin-top: 25px;">
            <div class="info-label">Catatan Tambahan</div>
            <div class="info-value" id="disp-note" style="color:#e67e22; font-style:italic;">-</div>
        </div>
        
        <div class="info-group">
            <div class="info-label">Waktu Update Terakhir</div>
            <div class="info-value" id="disp-time" style="font-size:13px;"></div>
        </div>
    </div>

    <div class="footer">
        &copy; 2024 KONTROL Facility Management<br>
        Data terhubung langsung ke Google Sheets
    </div>
</div>

<script>
    // --- KONFIGURASI SUMBER DATA (SAMA DENGAN GENERATOR) ---
    const GOOGLE_SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR1ed1CBEE_XALINYXAeepoKXlOKPyYLRiY35LL1OUd2wqgSbBgD2stFTG1YCjqfdCsNhc3A_PhrGE-/pub?gid=844795211&single=true&output=csv';
    const PROXY_URL = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(GOOGLE_SHEET_URL);

    // Ambil ID dari URL browser
    const params = new URLSearchParams(window.location.search);
    const targetID = params.get('id'); // Ambil ?id=...

    function init() {
        if (!targetID) {
            showError("QR Code tidak valid", "Tidak ditemukan ID APAR pada link ini.");
            return;
        }

        Papa.parse(PROXY_URL, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                const data = results.data;
                const found = data.find(r => r['NOMOR APAR'] && r['NOMOR APAR'].trim() === targetID.trim());
                
                if (found) {
                    renderUI(found);
                } else {
                    showError("Data Tidak Ditemukan", `Nomor APAR "<b>${targetID}</b>" belum terdaftar di Spreadsheet.`);
                }
            },
            error: function() {
                showError("Gagal Koneksi", "Tidak dapat mengambil data dari Google Sheets. Periksa internet Anda.");
            }
        });
    }

    function renderUI(row) {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('app-content').style.display = 'block';

        // 1. Render Informasi Dasar
        document.getElementById('disp-no').innerText = row['NOMOR APAR'];
        document.getElementById('disp-loc').innerText = row['LOKASI APAR'];
        document.getElementById('disp-type').innerText = row['JENIS APAR'];
        document.getElementById('disp-weight').innerText = row['BERAT APAR'];
        document.getElementById('disp-note').innerText = row['CATATAN'] || "-";
        document.getElementById('disp-time').innerText = row['Timestamp'];

        // 2. Logic Status & Checklist
        const checkItems = [
            { label: "Tekanan (Pressure)", val: row['ITEM CHECK [TEKANAN APAR]'] },
            { label: "Pin / Segel", val: row['ITEM CHECK [PIN / SEGEL]'] },
            { label: "Kondisi Selang", val: row['ITEM CHECK [SELANG ]'] },
            { label: "Tabung Fisik", val: row['ITEM CHECK [KONDISI FISIK]'] },
            { label: "Handle / Tuas", val: row['ITEM CHECK [HANDLE]'] },
            { label: "Kadaluarsa", val: row['ITEM CHECK [KADALUARSA]'] }
        ];

        let isProblem = false;
        let htmlList = "";

        checkItems.forEach(item => {
            // Deteksi masalah sederhana: jika text mengandung "rusak", "kurang", "hilang"
            const valLower = String(item.val).toLowerCase();
            const isBad = valLower.includes('rusak') || valLower.includes('hilang') || valLower.includes('kurang') || valLower.includes('korosi');
            
            if (isBad) isProblem = true;

            htmlList += `
                <tr>
                    <td class="check-item">${item.label}</td>
                    <td class="check-val ${isBad ? 'val-bad' : 'val-ok'}">
                        ${isBad ? '<i class="fas fa-times-circle"></i>' : '<i class="fas fa-check-circle"></i>'} 
                        ${item.val}
                    </td>
                </tr>
            `;
        });

        document.getElementById('checklist-body').innerHTML = htmlList;

        // 3. Tentukan Warna Header Status
        const statusContainer = document.getElementById('status-container');
        if (isProblem) {
            statusContainer.className = 'status-card bg-warn';
            statusContainer.innerHTML = `<div class="status-icon"><i class="fas fa-exclamation-triangle"></i></div><div class="status-text">Perlu Perhatian</div>`;
        } else {
            statusContainer.className = 'status-card bg-ok';
            statusContainer.innerHTML = `<div class="status-icon"><i class="fas fa-shield-alt"></i></div><div class="status-text">Kondisi Aman</div>`;
        }
    }

    function showError(title, msg) {
        document.getElementById('loader').innerHTML = `
            <div style="color:#e74c3c; font-size:40px; margin-bottom:10px;"><i class="fas fa-times-circle"></i></div>
            <h3 style="margin:0">${title}</h3>
            <p>${msg}</p>
        `;
    }

    window.onload = init;
</script>

</body>

</html>
